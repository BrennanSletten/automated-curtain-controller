<!DOCTYPE html>
<html>
<head>
    <title>Curtain Controller</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Curtains">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background-color: #0f0f0f; color: #e0e0e0; min-height: 100vh; padding: 24px 16px; }
        .container { max-width: 560px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 32px; }
        .header h1 { font-size: 28px; font-weight: 600; color: #ffffff; letter-spacing: -0.5px; }
        .header p { font-size: 13px; color: #666; margin-top: 4px; font-weight: 300; }
        .state-badge { display: inline-block; padding: 6px 16px; border-radius: 20px; font-size: 13px; font-weight: 500; margin-top: 12px; letter-spacing: 0.3px; }
        .state-open { background: #1a3a2a; color: #4ade80; border: 1px solid #2d5a3d; }
        .state-closed { background: #3a1a1a; color: #f87171; border: 1px solid #5a2d2d; }
        .state-unknown { background: #1e1e1e; color: #888; border: 1px solid #333; }
        .card { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 16px; padding: 20px; margin-bottom: 16px; }
        .card h2 { font-size: 13px; font-weight: 500; color: #666; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 16px; }
        .manual-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .btn { padding: 14px; border: none; border-radius: 12px; font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 500; cursor: pointer; transition: opacity 0.15s ease; }
        .btn:active { opacity: 0.7; }
        .btn-open { background: #1a3a2a; color: #4ade80; border: 1px solid #2d5a3d; }
        .btn-close { background: #3a1a1a; color: #f87171; border: 1px solid #5a2d2d; }
        .day-row { display: flex; align-items: center; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid #222; }
        .day-row:last-child { border-bottom: none; padding-bottom: 0; }
        .day-row:first-child { padding-top: 0; }
        .day-name { font-size: 15px; font-weight: 500; color: #e0e0e0; width: 90px; text-transform: capitalize; }
        .time-label { font-size: 11px; color: #555; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }
        input[type="time"] { background: #111; border: 1px solid #333; border-radius: 8px; color: #e0e0e0; font-family: 'Inter', sans-serif; font-size: 13px; padding: 6px 10px; width: 100px; }
        input[type="time"]:focus { outline: none; border-color: #444; }
        .toggle { position: relative; width: 40px; height: 22px; flex-shrink: 0; }
        .toggle input { opacity: 0; width: 0; height: 0; }
        .toggle-slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background: #333; border-radius: 22px; transition: 0.2s; }
        .toggle-slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background: #666; border-radius: 50%; transition: 0.2s; }
        .toggle input:checked + .toggle-slider { background: #1a3a2a; }
        .toggle input:checked + .toggle-slider:before { background: #4ade80; transform: translateX(18px); }
        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #1a3a2a; color: #4ade80; border: 1px solid #2d5a3d; padding: 10px 24px; border-radius: 20px; font-size: 13px; font-weight: 500; opacity: 0; transition: opacity 0.3s ease; pointer-events: none; }
        .toast.show { opacity: 1; }
        .footer { text-align: center; margin-top: 32px; font-size: 12px; color: #444; font-weight: 300; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🪟 Curtain Controller</h1>
            <p>Raspberry Pi 5 — Home Automation</p>
            <span class="state-badge state-{{ state }}" id="stateBadge">{{ state }}</span>
        </div>
        <div class="card">
            <h2>Manual Control</h2>
            <div class="manual-buttons">
                <button class="btn btn-open" onclick="manual('open')">↑ Open</button>
                <button class="btn btn-close" onclick="manual('close')">↓ Close</button>
		<button class="btn" onclick="stop()" style="background:#1a1a2a;color:#a78bfa;border:1px solid #3d2d5a;grid-column:span 2;">⏹ Emergency Stop</button>
            </div>
        </div>
        <div class="card">
            <h2>Weekly Schedule</h2>
            {% for day, times in schedule.items() %}
            <div class="day-row">
                <div style="width: 100%">
                    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;">
                        <span class="day-name">{{ day }}</span>
                        <label class="toggle">
                            <input type="checkbox" id="{{ day }}_enabled"
                                   {{ 'checked' if times.enabled else '' }}
                                   onchange="saveDay('{{ day }}')">
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                    <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
                        <div style="display: flex; align-items: center; gap: 6px;">
                            <span class="time-label">Open</span>
                            <input type="time" id="{{ day }}_open" value="{{ times.open }}" onchange="saveDay('{{ day }}')">
                        </div>
                        <div style="display: flex; align-items: center; gap: 6px;">
                            <span class="time-label">Close</span>
                            <input type="time" id="{{ day }}_close" value="{{ times.close }}" onchange="saveDay('{{ day }}')">
                        </div>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
        <div class="footer">Connected to curtainpi.local · Auto-saves on change</div>
    </div>
    <div class="toast" id="toast">Saved</div>
    <script>
    function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2000);
    }

    function saveDay(day) {
        fetch('/update_schedule', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                day: day,
                open: document.getElementById(day + '_open').value,
                close: document.getElementById(day + '_close').value,
                enabled: document.getElementById(day + '_enabled').checked
            })
        }).then(r => r.json()).then(d => showToast('Saved'));
    }

    function manual(action) {
        console.log('manual called:', action);
        fetch('/manual', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({action: action})
        })
        .then(r => r.json())
        .then(d => {
            console.log('response:', d);
            const badge = document.getElementById('stateBadge');
            badge.textContent = d.state;
            badge.className = 'state-badge state-' + d.state;
            showToast(action === 'open' ? 'Opening...' : 'Closing...');
        })
        .catch(e => {
            console.log('error:', e);
            showToast('Error');
        });
    }

    function stop() {
        console.log('stop called');
        fetch('/stop', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'}
        })
        .then(r => r.json())
        .then(d => showToast('Stopped'))
        .catch(e => showToast('Error'));
    }
</script>
</body>
</html>
